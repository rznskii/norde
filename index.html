<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NORDE — интернет-магазин скандинавского декора и предметов интерьера"
    />
    <link rel="stylesheet" href="css/main.css" />
    <title>NORDE</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__logo">
          <a href="/">NORDE</a>
        </div>

        <nav class="navigation" aria-label="Основная навигация">
          <ul class="navigation__list">
            <li class="navigation__item">
              <a href="/catalog" class="navigation__link">Каталог</a>
            </li>
            <li class="navigation__item">
              <a href="/collections" class="navigation__link">Коллекции</a>
            </li>
            <li class="navigation__item">
              <a href="/about" class="navigation__link">О нас</a>
            </li>
            <li class="navigation__item">
              <a href="/services" class="navigation__link">Услуги</a>
            </li>
          </ul>
          <ul class="navigation__list">
            <li class="navigation__item nav__button">
              <button type="button" class="button__search">
                <img src="/images/header/png/search.png" alt="Поиск" />
              </button>
            </li>
            <li class="navigation__item nav__button">
              <button type="button" class="button__auth">
                <img src="/images/header/png/auth.png" alt="Войти" />
              </button>
            </li>
            <li class="navigation__item nav__button">
              <button type="button" class="button__favorite">
                <img src="/images/header/png/favorite.png" alt="Избранное" />
              </button>
            </li>
            <li class="navigation__item nav__button">
              <button type="button" class="button__cart">
                <img src="/images/header/png/cart.png" alt="Корзина" />
              </button>
            </li>
          </ul>
        </nav>
      </div>
      <img
        class="header__background"
        src="/images/wallpaper/hero.png"
        alt="Фоновое изображение"
      />
    </header>

    <main class="main">
      <section class="hero">
        <div class="container hero__container">
          <div class="hero__content">
            <p class="hero__subtitle">дом, который чувствуется</p>

            <h1 class="hero__title">
              ДИЗАЙН.<br />ТЕПЛО.АТМОСФЕРА.<br />ВАШ ДОМ
            </h1>

            <p class="hero__description">
              Подберем вещи, которые создают настроение и делают каждый день
              уютнее.
            </p>

            <a href="#catalog" class="hero__button">
              Смотреть каталог
              <img
                src="/images/header/png/arrow-white.png"
                alt="Стрелка вправо"
              />
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
